<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль пользователя</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container" style="padding-top:30px;">
  <section class="card">
    <h2>Профиль пользователя</h2>
    <p>Эта страница — реальная цель ссылки с параметром <code>id</code> в URL.</p>
    <p id="params"></p>
    <p><a href="index.html">← Назад на главную</a></p>
  </section>
</main>
<script>
  var p = new URLSearchParams(location.search);
  var id = p.get('id');
  document.getElementById('params').textContent = id
    ? 'ID пользователя из URL: ' + id
    : 'ID не передан.';
</script>
</body>
</html>
